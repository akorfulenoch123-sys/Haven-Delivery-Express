{% extends "base.html" %}{% block title %}Log in | Haven Delivery Express{% endblock %}{% block content %}
<section class="form-section"><div class="form-card"><span class="kicker">WELCOME BACK</span><h1>Log in</h1><p>Access your bookings and delivery updates.</p><form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
<label>Email address<input type="email" name="email" required autocomplete="email" value="{{ request.form.get('email','') }}"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn blue full" type="submit">Log in</button></form><p class="form-foot">New to Haven? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
